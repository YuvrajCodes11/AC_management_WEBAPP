services:
  - type: web
    name: ac-management-webapp
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn puriaccooling.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true
